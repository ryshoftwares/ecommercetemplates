<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-label="Line illustration of a Modix smartphone, laptop and wireless headphones arranged together, representing the Technology, Refined product lineup">
  <defs>
    <radialGradient id="glow" cx="52%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2F5DFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2F5DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF0FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="#F5F6F8"/>
  <circle cx="360" cy="330" r="290" fill="url(#glow)"/>

  <!-- laptop, back layer -->
  <g opacity="0.95">
    <path d="M160 430 L540 430 L565 480 C565 490 557 496 546 496 L154 496 C143 496 135 490 135 480 Z" fill="#FFFFFF" stroke="#17181C" stroke-width="6"/>
    <path d="M200 200 L500 200 L520 430 L180 430 Z" fill="url(#screen)" stroke="#17181C" stroke-width="6"/>
    <rect x="222" y="224" width="256" height="160" fill="#FFFFFF" stroke="#17181C" stroke-width="2" opacity="0.5"/>
    <line x1="250" y1="255" x2="430" y2="255" stroke="#2F5DFF" stroke-width="4" opacity="0.6"/>
    <line x1="250" y1="280" x2="400" y2="280" stroke="#17181C" stroke-width="2" opacity="0.3"/>
    <line x1="250" y1="300" x2="410" y2="300" stroke="#17181C" stroke-width="2" opacity="0.3"/>
    <rect x="325" y="460" width="50" height="8" rx="4" fill="#17181C" opacity="0.35"/>
  </g>

  <!-- phone, front layer -->
  <g>
    <rect x="470" y="270" width="130" height="270" rx="26" fill="url(#screen)" stroke="#17181C" stroke-width="6"/>
    <rect x="484" y="292" width="102" height="212" rx="6" fill="#FFFFFF" stroke="#17181C" stroke-width="2" opacity="0.55"/>
    <rect x="510" y="280" width="40" height="7" rx="3" fill="#17181C" opacity="0.5"/>
    <circle cx="535" cy="519" r="8" fill="none" stroke="#17181C" stroke-width="3"/>
    <rect x="500" y="308" width="40" height="40" rx="8" fill="none" stroke="#2F5DFF" stroke-width="3"/>
    <circle cx="520" cy="328" r="10" fill="none" stroke="#2F5DFF" stroke-width="3"/>
  </g>

  <!-- headphones, foreground -->
  <g>
    <path d="M130 300 C130 210 170 155 220 155 C270 155 310 210 310 300" fill="none" stroke="#17181C" stroke-width="7" stroke-linecap="round"/>
    <path d="M142 300 C142 222 176 176 220 176 C264 176 298 222 298 300" fill="none" stroke="#2F5DFF" stroke-width="2" stroke-dasharray="3 7" opacity="0.55"/>
    <rect x="105" y="292" width="58" height="98" rx="24" fill="#FFFFFF" stroke="#17181C" stroke-width="6"/>
    <rect x="277" y="292" width="58" height="98" rx="24" fill="#FFFFFF" stroke="#17181C" stroke-width="6"/>
    <circle cx="134" cy="341" r="11" fill="none" stroke="#2F5DFF" stroke-width="3"/>
    <circle cx="306" cy="341" r="11" fill="none" stroke="#2F5DFF" stroke-width="3"/>
  </g>

  <!-- subtle accent particles -->
  <g stroke="#2F5DFF" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="590" y1="150" x2="590" y2="175"/>
    <line x1="578" y1="162" x2="602" y2="162"/>
    <line x1="120" y1="480" x2="120" y2="500"/>
    <line x1="110" y1="490" x2="130" y2="490"/>
  </g>
</svg>
