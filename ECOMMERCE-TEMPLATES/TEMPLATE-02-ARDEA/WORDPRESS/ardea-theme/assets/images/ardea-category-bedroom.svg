<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t3">
<title id="t3">Bedroom with an oak bed frame and walnut nightstand shown as warm abstract line art</title>
<defs>
<linearGradient id="c2-bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FAF7F2"/>
<stop offset="100%" stop-color="#EDE6DA"/>
</linearGradient>
<radialGradient id="c2-glow" cx="20%" cy="20%" r="55%">
<stop offset="0%" stop-color="#4B5A45" stop-opacity="0.26"/>
<stop offset="100%" stop-color="#4B5A45" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="800" height="1000" fill="url(#c2-bg)"/>
<ellipse cx="180" cy="220" rx="280" ry="240" fill="url(#c2-glow)"/>
<ellipse cx="420" cy="800" rx="320" ry="42" fill="#2E2A26" opacity="0.09"/>
<g stroke="#2E2A26" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
<path d="M150 420 L150 380 L650 380 L650 420"/>
<path d="M150 420 L650 420 L650 680 L150 680 Z"/>
<line x1="150" y1="480" x2="650" y2="480"/>
<path d="M150 380 L150 300 M650 380 L650 300"/>
<line x1="150" y1="300" x2="150" y2="260"/>
<line x1="650" y1="300" x2="650" y2="260"/>
</g>
<g stroke="#A9603E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
<rect x="700" y="560" width="90" height="120" rx="4"/>
<line x1="700" y1="600" x2="790" y2="600"/>
<line x1="700" y1="640" x2="790" y2="640"/>
</g>
</svg>
